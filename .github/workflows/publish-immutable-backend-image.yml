name: Publish immutable backend image

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full certified Git SHA to package
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Validate source SHA
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          if [[ ! "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "source_sha must be a full lowercase Git SHA" >&2
            exit 1
          fi

      - name: Check out packaging authority
        uses: actions/checkout@v4
        with:
          path: packaging

      - name: Check out certified source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          path: source

      - name: Assemble governed historical context
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          test "$(git -C source rev-parse HEAD)" = "$SOURCE_SHA"
          cp packaging/Dockerfile source/Dockerfile
          cp packaging/.dockerignore source/.dockerignore
          node packaging/scripts/verify-docker-build-context.js source

      - name: Record build timestamp
        run: echo "BUILD_CREATED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish exact source
        id: build
        uses: docker/build-push-action@v6
        with:
          context: source
          push: true
          tags: ghcr.io/meetroapp/metro-server:${{ inputs.source_sha }}
          build-args: |
            OCI_SOURCE=https://github.com/meetroapp/metro-server
            OCI_REVISION=${{ inputs.source_sha }}
            OCI_CREATED=${{ env.BUILD_CREATED_AT }}
            OCI_VERSION=${{ inputs.source_sha }}
            PACKAGING_REVISION=${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/meetroapp/metro-server
            org.opencontainers.image.revision=${{ inputs.source_sha }}
            org.opencontainers.image.created=${{ env.BUILD_CREATED_AT }}
            org.opencontainers.image.version=${{ inputs.source_sha }}
            io.meetro.packaging.revision=${{ github.sha }}
          provenance: mode=max
          sbom: true

      - name: Record immutable release identity
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          PACKAGING_SHA: ${{ github.sha }}
          WORKFLOW_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          test -n "$IMAGE_DIGEST"
          {
            echo "### Immutable backend image"
            echo "- Source: https://github.com/meetroapp/metro-server"
            echo "- Git SHA: $SOURCE_SHA"
            echo "- Packaging SHA: $PACKAGING_SHA"
            echo "- Tag: ghcr.io/meetroapp/metro-server:$SOURCE_SHA"
            echo "- Digest: ghcr.io/meetroapp/metro-server@$IMAGE_DIGEST"
            echo "- Built: $BUILD_CREATED_AT"
            echo "- Workflow run: $WORKFLOW_RUN_URL"
          } >> "$GITHUB_STEP_SUMMARY"
